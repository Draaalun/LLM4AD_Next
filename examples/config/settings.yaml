# LLM4AD Global Settings
# Path: ~/.llm4ad/settings.yaml
#
# Define reusable providers here. Task configs can reference them by name,
# and the full definition will be merged automatically.
#
# Environment variables can be used with ${VAR_NAME} syntax.
# Override this file's location with LLM4AD_SETTINGS_FILE env var.

providers:
  - name: "planner"
    type: "openai_compatible"
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o"
    temperature: 0.3
    max_tokens: 32768
    timeout: 120.0
    max_retries: 3

  - name: "coder"
    type: "anthropic"
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-sonnet-4-20250514"
    temperature: 0.1
    max_tokens: 32768
    timeout: 120.0
    max_retries: 3
