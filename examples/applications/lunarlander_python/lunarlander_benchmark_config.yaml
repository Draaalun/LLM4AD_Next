# ==============================================================================
# LLM4AD Configuration for LunarLander Policy Evolution
# ==============================================================================

# ==============================================================================
# SECTION 1: General Settings (通用设置)
# ==============================================================================
# Project name, used for output directory organization
project_name: "lunarlander_python"

# Short descriptions for frontend display (English / Chinese)
description_en: "Evolve control policies that safely land the LunarLander at the target across random initializations."
description_zh: "进化 LunarLander 控制策略，使其在多种随机初始条件下安全着陆到目标位置。"

# Background description of the task, passed to LLM for context
background: |
  In this benchmark, we aim to evolve control policies for the LunarLander environment.
  The goal is to create a policy that safely lands the lander at the target location (0, 0)
  across multiple random initializations.

  A 'safe landing' is defined as a touchdown with:
  - Low vertical speed
  - Upright orientation (angle close to 0)
  - Low angular velocity
  - Both legs in contact with the ground

  The policy is evaluated on multiple random seeds, measuring:
  - Episode reward (higher is better, safe landing ~200)
  - Fuel consumption (lower is better)
  - Execution time (lower is better)
  - Success rate (higher is better)

# Random seed for reproducibility across all components
random_seed: 42

# Base working directory where the task directory will be created
base_dir: "./runs"

# ==============================================================================
# SECTION 1.5: Workspace Configuration (工作空间配置)
# ==============================================================================
workspace:
  auto_create: true
  subdirs:
    output: "output"
    logs: "logs"
    checkpoints: "checkpoints"
    generated: "generated"
    cache: "cache"
    temp: "temp"

# ==============================================================================
# SECTION 2: LLM Provider Configuration (LLM 提供者配置)
# ==============================================================================
providers:
  - name: "default"
    type: "openai_compatible"
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    temperature: 0.7
    max_tokens: 4096
    timeout: 120.0

# ==============================================================================
# SECTION 3: Coder Configuration (代码生成器配置)
# ==============================================================================
coder:
  # --- Coder Type ---
  type: "custom"
  provider: "default"

  # --- Generation Parameters ---
  timeout: 300.0
  max_retries: 3
  temperature: 0.7
  max_gen_tokens: 4096
  context_max_tokens: 4096
  default_extension: "py"
  log_to_console: false

  # --- Prompt Template ---
  prompt_template: |
    You are tasked with implementing a control policy for the LunarLander environment.

    Problem Description:
    The LunarLander environment simulates a lander trying to land safely on a landing pad.
    The landing pad is located at position (0, 0) with width from x=-2 to x=2.

    At each time step, your policy function is called with:
    - s (list): Current state vector with 8 elements:
        * s[0]: Horizontal position (x-coordinate)
        * s[1]: Vertical position (y-coordinate)
        * s[2]: Horizontal velocity (vx)
        * s[3]: Vertical velocity (vy)
        * s[4]: Angle in radians (0 is upright)
        * s[5]: Angular velocity
        * s[6]: 1 if left leg is in contact with ground, else 0
        * s[7]: 1 if right leg is in contact with ground, else 0

    - last_action (int): The action taken in the previous step
    - s_pre (list): The state vector before the last action was executed

    Your policy must return an action:
    - 0: Do nothing (coast)
    - 1: Fire left orientation engine (rotate counter-clockwise)
    - 2: Fire main engine (thrust upward, also consumes fuel)
    - 3: Fire right orientation engine (rotate clockwise)

    Your function signature should be:
    ```python
    def choose_action(s, last_action, s_pre):
        """Selects an action for LunarLander to achieve safe landing."""
        # Your policy logic here
        return action  # Must be 0, 1, 2, or 3
    ```

    Success Criteria:
    - Land on the pad (x between -2 and 2, y close to 0)
    - Low vertical velocity (not crashing)
    - Upright orientation (angle close to 0)
    - Low angular velocity

    Reward Structure:
    - Reward between -100 and +100 per step
    - Episode reward accumulates over all steps
    - Safe landing gives ~200 total reward
    - Crashing gives negative reward

    Key Considerations:
    1. Control angle to keep lander upright
    2. Manage horizontal velocity to aim for center
    3. Control vertical velocity for soft landing
    4. Conserve fuel (action 2 consumes fuel)
    5. Handle initial random positioning and velocities

    Recommended Approaches:
    - State machine based on landing phase (approach, descent, landing)
    - Proportional control using state feedback
    - Bang-bang control for thrust
    - Heuristic rules based on state thresholds

    Provide only the complete implementation of the choose_action function between EVOLVE_START and EVOLVE markers.

# ==============================================================================
# SECTION 4: Planner Configuration (规划器配置)
# ==============================================================================
planner:
  type: "llm_evolution"
  provider: "default"

  # Selection strategies
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"

  # Build configuration
  build:
    script: {}

  # Samplers
  samplers:
    - name: "init_sampler"
    - name: "mutation_sampler"
    - name: "crossover_sampler"

# ==============================================================================
# SECTION 5: Evaluator Configuration (评估器配置)
# ==============================================================================
evaluator:
  # --- Evaluator Type ---
  type: "custom"

  # Custom evaluator module path
  module: "lunarlander_evaluator.py:LunarLanderPolicyEvaluator"

  # --- Execution Settings ---
  timeout: 120.0
  max_retries: 2
  parallel: true
  batch_size: 8

  # --- Dataset Configuration ---
  dataset:
    mode: "directory"
    path: "data/train"
    recursive: false

  # --- Metrics ---
  metrics:
    - "episode_reward"
    - "fuel_consumed"
    - "success"
    - "execution_time_ms"

# ==============================================================================
# SECTION 6: Evolution Configuration (进化算法配置)
# ==============================================================================
evolution:
  # --- Evolution Type ---
  type: "island_ga"

  # --- Common Parameters ---
  max_generations: 5
  early_stop_patience: 5
  early_stop_threshold: 0.001
  checkpoint_interval: 5
  max_checkpoints: 3
  max_llm_concurrency: 4

  # --- Island GA Parameters ---
  elite_ratio: 0.2
  mutation_rate: 0.3
  crossover_rate: 0.5
  parent_selection_strategy: "tournament"
  survival_selection_strategy: "truncation"
  tournament_size: 3

  # Island-specific
  num_islands: 2
  island_population_size: 3
  migration_interval: 5
  migration_rate: 0.1
  migration_strategy: "random"
  migration_topology: "full"
  parallel_islands: true

  # --- Display ---
  human_readable_timing: true

# ==============================================================================
# SECTION 7: Multimodal Configuration (多模态配置)
# ==============================================================================
multimodal:
  enabled: false
  max_images_per_prompt: 3
  image_max_size_kb: 512
  include_observation_text: true
  two_step_refinement: false
  behavior_storage: "rendered"

# ==============================================================================
# SECTION 8: Logging Configuration (日志配置)
# ==============================================================================
logging:
  level: "INFO"
  format: null
  file: null
  console: true
  json_format: false

# ==============================================================================
# SECTION 9: Version Control Configuration (版本控制配置)
# ==============================================================================
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "policy"
  remote_url: null
  revision: null
  auto_initialize: true
  auto_cleanup: true
  max_worktree_age_days: 7
  max_worktrees: 100
  default_branch: "main"
  commit_message_template: "Algorithm {algorithm_id}: {description}"

# ==============================================================================
# SECTION 10: Repository Analyzer Configuration (仓库分析器配置)
# ==============================================================================
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include:
    - "*.py"
  exclude:
    - ".git/**"
    - "__pycache__/**"
    - "*.pyc"
