# ==============================================================================
# LLM4AD Configuration for MCM 2024 Problem D: Great Lakes Water Level Control
# ==============================================================================

# ==============================================================================
# SECTION 1: General Settings (通用设置)
# ==============================================================================
# Project name, used for output directory organization
project_name: "MCM_ICM_problem_2024_D"

# Short descriptions for frontend display (English / Chinese)
description_en: "Evolve modeling methodologies for Great Lakes dam release decisions balancing six stakeholder objectives."
description_zh: "针对五大湖大坝放水决策，进化平衡六类利益相关方目标的建模方法体系。"

# Background description of the task, passed to LLM for context
background: |
  This is a multi-objective constrained optimization problem. We need to
  design water release policies for dams that balance 6 stakeholder objectives:
  flood prevention, navigation, hydropower, recreation, ecosystem health, and
  municipal water supply.

  **LLM4AD Core Innovation for this problem:**
  Unlike standard benchmarks where we evolve parameters, here we are evolving
  THE MODELING METHODOLOGY ITSELF. Each individual represents a complete
  modeling design choice across 8 dimensions:
  1. dynamics          - How we model water flow physics
  2. constraints       - How we handle dam physical constraints
  3. objective_form    - Mathematical form of the objective function
  4. stakeholders      - Which stakeholders we explicitly model
  5. solver            - Which optimization algorithm we use
  6. temporal          - Temporal discretization architecture
  7. robustness        - Robustness paradigm
  8. coupling          - Multi-objective weighting/coupling method
  The search space contains 4*4*5*4*6*4*4*5 = 153,600 unique modeling paradigms.

# Random seed for reproducibility across all components
random_seed: 42

# Base working directory where the task directory will be created
base_dir: "./runs"

# ==============================================================================
# SECTION 1.5: Workspace Configuration (工作空间配置)
# ==============================================================================
workspace:
  auto_create: true
  subdirs:
    output: "output"
    logs: "logs"
    checkpoints: "checkpoints"
    generated: "generated"
    cache: "cache"
    temp: "temp"

# ==============================================================================
# SECTION 2: LLM Provider Configuration (LLM 提供者配置)
# ==============================================================================
providers:
  - name: "default"
    type: "openai_compatible"
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    temperature: 0.7
    max_tokens: 4096
    timeout: 120.0

# ==============================================================================
# SECTION 3: Coder Configuration (代码生成器配置)
# ==============================================================================
coder:
  # --- Coder Type ---
  type: "custom"
  provider: "default"

  # --- Generation Parameters ---
  timeout: 300.0
  max_retries: 3
  temperature: 0.3
  max_gen_tokens: 2000
  context_max_tokens: 4096
  default_extension: "py"
  log_to_console: false

  # --- Prompt Template ---
  prompt_template: |
    {insight}

    ================================================
    **IMPORTANT - IGNORE ALL FORMAT INSTRUCTIONS ABOVE**
    **FOLLOW THESE RULES EXACTLY - NO DEVIATIONS**
    ================================================

    **STRICT OUTPUT REQUIREMENTS**:
    Output ONLY the complete genotype.py file using NAMED CODE BLOCK
    Use EXACT format: ```python:genotype.py (CRITICAL: colon + filename)
    Choose ONLY from the VALID ALLELES listed below
    DO NOT invent new allele names (NO "hybrid_dynamic", etc.)
    DO NOT modify dict keys, comments, EVOLVE markers, or indentation
    DO NOT add docstrings, imports, classes, or functions
    DO NOT output any explanation text - ONLY the code block!

    **VALID ALLELES (YOU MUST SELECT FROM THIS LIST ONLY)**:
    1. dynamics: simple_mass_balance, seasonal_evap, flow_delay, stochastic_inflow
    2. constraints: hard_clipping, soft_penalty, barrier_function, leaky_constraint
    3. objective_form: linear_weighted, chebyshev, exponential_utility, lexicographic, min_max_fairness
    4. stakeholders: core_3, balanced_4, comprehensive_5, full_6
    5. solver: nsga2, linear_program, particle_swarm, bayesian_opt
    6. temporal: annual_monthly, seasonal_peak, multi_year, event_triggered
    7. robustness: deterministic, worst_case, stochastic_expected, stochastic_cvar
    8. coupling: equal_weight, entropy_weight, ahp_hierarchy, pareto_filter, topsis

    Output EXACTLY the code block below with ONLY the 8 string values changed to your choices:

    ```python:genotype.py
    """Great Lakes modeling methodology genotype."""

    # EVOLVE_START
    dynamics = "simple_mass_balance"
    constraints = "hard_clipping"
    objective_form = "linear_weighted"
    stakeholders = "core_3"
    solver = "nsga2"
    temporal = "annual_monthly"
    robustness = "deterministic"
    coupling = "equal_weight"
    # EVOLVE_END

    GENOTYPE = {{
        "dynamics": dynamics,
        "constraints": constraints,
        "objective_form": objective_form,
        "stakeholders": stakeholders,
        "solver": solver,
        "temporal": temporal,
        "robustness": robustness,
        "coupling": coupling,
    }}
    ```

  # --- Mutation Prompt Template ---
  mutation_prompt_template: |
    Modeling problem context: Great Lakes water level multi-objective optimization.

    Mutation insight: {insight}

    8 DIMENSIONS AND THEIR VALID ALLELES:
    1. dynamics: simple_mass_balance, seasonal_evap, flow_delay, stochastic_inflow
    2. constraints: hard_clipping, soft_penalty, barrier_function, leaky_constraint
    3. objective_form: linear_weighted, chebyshev, exponential_utility, lexicographic, min_max_fairness
    4. stakeholders: core_3, balanced_4, comprehensive_5, full_6
    5. solver: nsga2, linear_program, particle_swarm, bayesian_opt
    6. temporal: annual_monthly, seasonal_peak, multi_year, event_triggered
    7. robustness: deterministic, worst_case, stochastic_expected, stochastic_cvar
    8. coupling: equal_weight, entropy_weight, ahp_hierarchy, pareto_filter, topsis

    Original EVOLVE block content:
    ```
    {original_block}
    ```

    Task: Mutate ONLY the allele values. DO NOT change variable names.
    Output ONLY the 8 lines of variable assignments to be placed inside EVOLVE_START/EVOLVE_END:

    ```python:genotype.py
    dynamics = "chosen_allele"
    constraints = "chosen_allele"
    objective_form = "chosen_allele"
    stakeholders = "chosen_allele"
    solver = "chosen_allele"
    temporal = "chosen_allele"
    robustness = "chosen_allele"
    coupling = "chosen_allele"
    ```

# ==============================================================================
# SECTION 4: Planner Configuration (规划器配置)
# ==============================================================================
planner:
  type: "llm_evolution"
  provider: "default"

  # Selection strategies
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"

  # Build configuration
  build:
    script: {}

  # Samplers
  samplers:
    - name: "init_sampler"
    - name: "mutation_sampler"
    - name: "crossover_sampler"

# ==============================================================================
# SECTION 5: Evaluator Configuration (评估器配置)
# ==============================================================================
evaluator:
  # --- Evaluator Type ---
  type: "custom"

  # Custom evaluator module path
  module: "great_lakes_evaluator.py:GreatLakesModelingEvaluator"

  # --- Execution Settings ---
  timeout: 60.0
  max_retries: 2
  parallel: true
  batch_size: 4

  # --- Dataset Configuration ---
  dataset:
    mode: "files"
    files:
      - "data/train/great_lakes_data.json"

  # --- Metrics ---
  metrics:
    - "flood_prevention"
    - "navigation"
    - "hydropower"
    - "recreation"
    - "ecosystem"
    - "municipal_water"
    - "constraint_satisfaction"
    - "backtesting_deviation"
    - "sensitivity_score"
    - "overall_fitness"

# ==============================================================================
# SECTION 6: Evolution Configuration (进化算法配置)
# ==============================================================================
evolution:
  # --- Evolution Type ---
  type: "island_ga"

  # --- Common Parameters ---
  max_generations: 20
  early_stop_patience: 5
  early_stop_threshold: 0.001
  checkpoint_interval: 5
  max_checkpoints: 3
  max_llm_concurrency: 4

  # --- Island GA Parameters ---
  elite_ratio: 0.1
  mutation_rate: 0.7
  crossover_rate: 0.3
  parent_selection_strategy: "tournament"
  survival_selection_strategy: "truncation"
  tournament_size: 3

  # Island-specific
  num_islands: 4
  island_population_size: 10
  migration_interval: 3
  migration_rate: 0.15
  migration_strategy: "best"
  migration_topology: "ring"
  parallel_islands: true

  # --- Display ---
  human_readable_timing: true

# ==============================================================================
# SECTION 7: Multimodal Configuration (多模态配置)
# ==============================================================================
multimodal:
  enabled: false
  max_images_per_prompt: 3
  image_max_size_kb: 512
  include_observation_text: true
  two_step_refinement: false
  behavior_storage: "rendered"

# ==============================================================================
# SECTION 8: Logging Configuration (日志配置)
# ==============================================================================
logging:
  level: "INFO"
  format: null
  file: null
  console: true
  json_format: false

# ==============================================================================
# SECTION 9: Version Control Configuration (版本控制配置)
# ==============================================================================
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "./template"
  remote_url: null
  revision: null
  auto_initialize: true
  auto_cleanup: false
  max_worktree_age_days: 7
  max_worktrees: 100
  default_branch: "main"
  commit_message_template: "Algorithm {algorithm_id}: {description}"

# ==============================================================================
# SECTION 10: Repository Analyzer Configuration (仓库分析器配置)
# ==============================================================================
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include:
    - "*.py"
  exclude:
    - ".git/**"
    - "__pycache__/**"
    - "*.pyc"
