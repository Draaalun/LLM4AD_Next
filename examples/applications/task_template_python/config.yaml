# ==============================================================================
# LLM4AD Task Configuration Template (Python)
# ==============================================================================

# ==============================================================================
# SECTION 1: General Settings (通用设置)
# ==============================================================================
# Project name, used for output directory organization
project_name: "my_task_python"

# Short descriptions for frontend display (English / Chinese)
description_en: "Starter template for a Python evolution task — fill in the background and evaluator for your own problem."
description_zh: "Python 进化任务的起步模板，根据自身问题填写背景说明与评估器即可使用。"

# Background description of the task, passed to LLM for context
background: |
  TEMPLATE: Describe your optimization problem here.

  Example: "We aim to evolve efficient algorithms for [PROBLEM].
  The goal is to [OBJECTIVE] while [CONSTRAINTS].
  The evolved algorithms will be evaluated on [DATA], measuring [METRICS]."

# Random seed for reproducibility across all components
random_seed: 42

# Base working directory where the task directory will be created
base_dir: "./runs"

# ==============================================================================
# SECTION 1.5: Workspace Configuration (工作空间配置)
# ==============================================================================
workspace:
  auto_create: true
  subdirs:
    output: "output"
    logs: "logs"
    checkpoints: "checkpoints"
    generated: "generated"
    cache: "cache"
    temp: "temp"

# ==============================================================================
# SECTION 2: LLM Provider Configuration (LLM 提供者配置)
# ==============================================================================
providers:
  - name: "default"
    type: "openai_compatible"
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    temperature: 0.7
    max_tokens: 4096
    timeout: 120.0

# ==============================================================================
# SECTION 3: Coder Configuration (代码生成器配置)
# ==============================================================================
coder:
  # --- Coder Type ---
  type: "custom"
  provider: "default"

  # --- Generation Parameters ---
  timeout: 300.0
  max_retries: 3
  temperature: 0.7
  max_gen_tokens: 4096
  context_max_tokens: 4096
  default_extension: "py"
  log_to_console: false

  # --- Prompt Template ---
  prompt_template: |
    You are tasked with implementing an algorithm for [PROBLEM].

    Problem Description:
    [Detailed description of the problem]

    Your task is to implement the function signature below:

    ```python
    import json
    import sys

    # Your algorithm should be between EVOLVE_START and EVOLVE_END markers
    # EVOLVE_START
    def my_algorithm(data):
        '''TEMPLATE: Describe what the function should do'''
        pass
    # EVOLVE_END

    def process(data):
        result = my_algorithm(data)
        return {"result": result}

    def main():
        if len(sys.argv) < 2:
            sys.exit(1)
        input_data = json.loads(sys.argv[1])
        result = process(input_data)
        print(json.dumps(result))

    if __name__ == "__main__":
        main()
    ```

    Requirements:
    1. [Correctness requirement]
    2. [Performance requirement]
    3. [Any constraints]

    Provide only the complete implementation of the my_algorithm function
    between EVOLVE_START and EVOLVE_END markers.

# ==============================================================================
# SECTION 4: Planner Configuration (规划器配置)
# ==============================================================================
planner:
  type: "llm_evolution"
  provider: "default"

  # Selection strategies
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"

  # Build configuration
  build:
    script: {}

  # Samplers
  samplers:
    - name: "init_sampler"
    - name: "mutation_sampler"
    - name: "crossover_sampler"

# ==============================================================================
# SECTION 5: Evaluator Configuration (评估器配置)
# ==============================================================================
evaluator:
  # --- Evaluator Type ---
  type: "custom"

  # Custom evaluator module path
  module: "my_evaluator.py:MyTaskEvaluator"

  # --- Execution Settings ---
  timeout: 60.0
  max_retries: 2
  parallel: true
  batch_size: 5

  # --- Dataset Configuration ---
  dataset:
    mode: "directory"
    path: "data/sample"
    recursive: false

  # --- Metrics ---
  metrics:
    - "primary_score"
    - "execution_time_ms"

# ==============================================================================
# SECTION 6: Evolution Configuration (进化算法配置)
# ==============================================================================
evolution:
  # --- Evolution Type ---
  type: "island_ga"

  # --- Common Parameters ---
  max_generations: 5
  early_stop_patience: 10
  early_stop_threshold: 0.000001
  checkpoint_interval: 5
  max_checkpoints: 3

  # --- Island GA Parameters ---
  elite_ratio: 0.1
  mutation_rate: 0.3
  crossover_rate: 0.5
  parent_selection_strategy: "tournament"
  survival_selection_strategy: "truncation"
  tournament_size: 3

  # Island-specific
  num_islands: 1
  island_population_size: 2
  migration_interval: 5
  migration_rate: 0.1
  migration_strategy: "random"
  migration_topology: "full"
  parallel_islands: true

  # --- Display ---
  human_readable_timing: true

# ==============================================================================
# SECTION 7: Multimodal Configuration (多模态配置)
# ==============================================================================
multimodal:
  enabled: false
  max_images_per_prompt: 3
  image_max_size_kb: 512
  include_observation_text: true
  two_step_refinement: false
  behavior_storage: "rendered"

# ==============================================================================
# SECTION 8: Logging Configuration (日志配置)
# ==============================================================================
logging:
  level: "INFO"
  format: null
  file: null
  console: true
  json_format: false

# ==============================================================================
# SECTION 9: Version Control Configuration (版本控制配置)
# ==============================================================================
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "my_algorithm"
  remote_url: null
  revision: null
  auto_initialize: true
  auto_cleanup: true
  max_worktree_age_days: 7
  max_worktrees: 100
  default_branch: "main"
  commit_message_template: "Algorithm {algorithm_id}: {description}"

# ==============================================================================
# SECTION 10: Repository Analyzer Configuration (仓库分析器配置)
# ==============================================================================
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include:
    - "*.py"
  exclude:
    - ".git/**"
    - "__pycache__/**"
    - "*.pyc"
