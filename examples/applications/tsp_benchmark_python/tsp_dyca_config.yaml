# LLM4AD Configuration for TSP with DyCA (Dynamic Clustering Algorithm)
#
# DyCA automatically clusters the 18 diverse TSP instances into groups
# (small-random, clustered, large-random) and evolves specialist algorithms
# for each cluster while maintaining cross-cluster diversity.

project_name: "tsp_dyca"

# Short descriptions for frontend display (English / Chinese)
description_en: "Evolve TSP solvers with DyCA, auto-clustering 18 diverse instances and breeding specialist algorithms per cluster."
description_zh: "使用 DyCA 自动聚类 18 个多样 TSP 实例，并为每个簇培育专用求解算法。"

background: |
  We aim to evolve efficient algorithms for the Traveling Salesman Problem (TSP).
  The dataset contains diverse instances: small random (10-20 cities),
  clustered layouts (30-50 cities in spatial clusters), and large random
  (60-100 cities). Different instance types may benefit from different strategies:
  - Small: exhaustive local search or exact methods
  - Clustered: cluster-first-route-second approaches
  - Large: fast constructive heuristics with targeted local search
  The goal is to evolve algorithms that handle this diversity well.

base_dir: "./runs"
random_seed: 42

# LLM Providers
providers:
  - name: "default"
    type: "openai_compatible"
    # Use environment variables or set directly
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 8192
    timeout: 120.0

# Evaluator — custom PythonTSPEvaluator, using the diverse dataset
evaluator:
  type: "custom"
  module: "tsp_evaluator.py:PythonTSPEvaluator"
  timeout: 120.0
  max_retries: 2
  parallel: true
  batch_size: 6
  dataset:
    mode: "directory"
    path: "data/diverse"
    recursive: false
  metrics: ["tour_length", "execution_time_ms", "valid_tour"]

# Evolution — DyCA orchestrator
evolution:
  type: "dyca"
  # Pass background to DyCA (EvolutionConfig allows extra fields)
  background: |
    We aim to evolve efficient algorithms for the Traveling Salesman Problem (TSP).
    The dataset contains diverse instances: small random (10-20 cities),
    clustered layouts (30-50 cities in spatial clusters), and large random
    (60-100 cities). Different instance types may benefit from different strategies.

  # General evolution parameters
  max_generations: 4
  population_size: 5
  elite_ratio: 0.1
  parent_selection_strategy: "tournament"
  tournament_size: 3

  # DyCA-specific parameters
  n_clusters: 2               # Auto-select via elbow method
  clustering_method: "kmeans"
  recluster_interval: 5       # Check reclustering every 5 generations
  ari_threshold: 0.8          # Stability threshold for cluster labels
  n_anchors: 2                # Anchor algorithms for feature extraction (must <= population_size)

  # Pool sizes
  generalist_pool_size: 8
  specialist_pool_size: 6
  complementary_pool_size: 6
  elite_archive_size: 3

  # SOS (Save Our Specialist) — trigger after 3 stagnant generations
  sos_stagnation_threshold: 3

  # Resource allocation
  base_complementary_ratio: 0.2
  offspring_per_generation: 5  # New individuals per generation

  # Early stopping and checkpoints
  early_stop_patience: 10
  early_stop_threshold: 1e-6
  checkpoint_interval: 5
  max_checkpoints: 3

# Planner — must include DyCA samplers
planner:
  type: "llm_evolution"
  provider: "default"
  selection_strategy: "weighted"
  samplers:
    - name: "init_sampler"
    - name: "e1_sampler"
      config:
        temperature: 0.7
    - name: "e2_sampler"
      config:
        temperature: 0.9
    - name: "m1_sampler"
      config:
        temperature: 0.5
    - name: "m2_sampler"
      config:
        temperature: 1.0
    - name: "summary_sampler"
      config:
        temperature: 0.7
    - name: "complementary_cross_sampler"
      config:
        temperature: 0.8
    # Keep standard samplers as fallbacks
    - name: "mutation_sampler"
    - name: "crossover_sampler"

# Coder configuration
coder:
  type: "custom"
  provider: "default"
  timeout: 180.0
  max_retries: 2
  temperature: 0.7
  max_gen_tokens: 4096
