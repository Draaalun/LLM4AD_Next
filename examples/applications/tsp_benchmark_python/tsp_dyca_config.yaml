# Memory configuration
memory:
  embedding_dim: 768
  max_entries: 1000
  similarity_threshold: 0.8
  decay_factor: 0.99

# Logging
logging:
  level: "INFO"
  console: true
  json_format: false

# Version control
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "tsp_algorithm"
  auto_initialize: true
  auto_cleanup: true

# Repository analyzer
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include: ["*.py"]
  exclude: [".git/**", "__pycache__/**", "*.pyc"]
