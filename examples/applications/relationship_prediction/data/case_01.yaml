case_id: "case_001_anxious_avoidant"
relationship_type: "恋爱（同居一年）"

person_a:
  mbti: "INTJ"
  attachment_style: "疏离-回避型"
  core_traits: ["极度需要个人边界", "用解决问题代替提供情绪", "慕强且慕智", "压抑负面情绪"]
  trigger_points: "当对方哭闹或反复追问时，会本能地想逃跑或关机。"
  typical_behavior: "遇到冲突时会进入‘机器人模式’，用极度冷静客观的语气分析对错，并且拒绝肢体接触。"

person_b:
  mbti: "ENFP"
  attachment_style: "焦虑-前置型"
  core_traits: ["高共情", "通过分享琐碎小事建立连接", "害怕冷暴力", "情绪写在脸上"]
  trigger_points: "对方回复消息变慢、语气变冷、或者在自己激动时对方无动于衷。"
  typical_behavior: "吵架时必须要‘现在立刻解决’，会不断抛出问题：‘你是不是不爱我了？’‘你到底在想什么？’如果A不回应，B会从委屈升级为暴怒，最后崩溃大哭。"

current_crisis:
  event: "昨晚B因为A在打游戏时敷衍回复，情绪爆发，拉着A要求谈话谈了3个小时。A全程一言不发，最后突然站起来说‘我受够了这种无意义的内耗’，锁上了书房的门。"
  current_state: "B在门外哭到干呕后睡了沙发。今早A像没事人一样给B带了早餐，但没有任何道歉。B觉得自己的灵魂被碾碎了，正在考虑是不是该搬走。"
  
evaluator_focus: |
  重点推演：A的“假装无事发生”策略在未来一周会引发B怎样的反扑？B的“搬走”威胁是真心还是求挽留？双方谁会先破防？哪一方做出什么行为有机会补救关系？
