case_id: "case_004_secure_anxious"
relationship_type: "恋爱（同居八个月）"

person_a:
  mbti: "ISTP"
  attachment_style: "安全型"
  core_traits: ["极强的情绪稳定性", "行动派（用修东西/做家务代替说安慰的话）", "就事论事", "需要独处时间充电但不逃避亲密"]
  trigger_points: "对方情绪崩溃时如果过度上纲上线（如‘你从来不考虑我’），会感到烦躁和不解。"
  typical_behavior: "遇到冲突时会先沉默几秒钟消化，然后试图把问题拆解成具体的‘可以怎么改’的步骤。如果对方持续咆哮，会建议‘等大家都冷静一下再聊’。"

person_b:
  mbti: "INFJ"
  attachment_style: "焦虑-前置型（但具备高自我觉察力）"
  core_traits: ["高共情且敏感", "需要深度的情感确认（灵魂共鸣感）", "习惯性内耗但能自我拉回", "看重承诺和仪式感"]
  trigger_points: "对方在自己表达脆弱时给出冷冰冰的逻辑分析，或者试图用物质/行动敷衍过去而不触及情绪核心。"
  typical_behavior: "生气时不会大吵大闹，而是变得异常安静、眼神躲闪、回答‘没事’但明显带有哭腔。如果A没有主动察觉并追问，B会在心里给这段关系扣分，直到某天突然爆发一场‘深度对话’。"

current_crisis:
  event: "周末两人原本计划去拍情侣照，B提前两周就定好了妆造并很期待。但到了周六早上，A说昨晚熬夜打游戏太累，想改成下周去。B瞬间情绪跌入谷底，觉得A根本不重视自己精心准备的事。A觉得只是推迟一下，无法理解B为何反应如此剧烈，于是解释了两句后选择出门打篮球‘透透气’。"
  current_state: "B一整天没回A的消息。A打完球买了他最爱吃的日料食材回来，正在厨房默默做饭，偶尔探头看沙发上的B，笨拙地试图用食物示好。B心里很感动但还在气头上，处于‘想原谅但觉得必须让他长点记性’的纠结状态。"
  
evaluator_focus: |
  重点推演：A的“用行动示好但不触及情绪核心”的笨拙修复，能否化解B的“他不重视我”的定性判断？B的冷暴力惩罚会在第几天绷不住？这场危机最终会以哪种方式软着陆？
