# ==============================================================================
# LLM4AD Configuration for Relationship Outcome Prediction
# ==============================================================================


# ==============================================================================
# SECTION 1: General Settings (通用设置)
# ==============================================================================
# Project name, used for output directory organization
project_name: "relationship_outcome_prediction"

# Background description of the task, passed to LLM for context
background: |
  This project predicts the most likely outcome for a relationship crisis case
  using a MULTI-OUTCOME COMPETITION approach.

  ===== CRITICAL CONSTRAINT =====
  You are evolving PREDICTION TEXT, not code or algorithms.
  The EVOLVE block contains `get_prediction() -> str` which returns a hardcoded
  Chinese-language prediction string. You MUST keep this structure:
  - The function takes NO arguments
  - The function body is ONLY a return statement with string concatenation
  - Do NOT add imports, classes, data structures, simulations, or API calls
  - Do NOT rename the function or change its signature
  - ONLY modify the TEXT CONTENT of the returned string
  - The output file MUST be named predict_seed.py (not implementation.py)
  ===== END CONSTRAINT =====

  ===== EVALUATION PRIORITY =====
  The evaluator judges WHETHER YOU PICKED THE RIGHT OUTCOME, not how well
  you write. A plainly-written prediction that picks the correct most-likely
  outcome will score HIGHER than a beautifully-written prediction that picks
  the wrong outcome. Focus on:
  1. Is the primary outcome truly the most probable given these two people?
  2. Are the alternative outcomes real possibilities (not strawmen)?
  3. Does the exclusion reasoning pinpoint specific trait differences?
  ===== END PRIORITY =====

  Your task: improve the prediction to select the most probable outcome.
  Think about:
  - Given these specific personality traits, what outcome has the highest probability?
  - What alternative outcomes are genuinely possible, and why are they less likely?
  - Which specific traits determine the probability ranking between outcomes?
  - Is the primary outcome probability >50%? Be decisive, not hedging.

  ## The Case to Predict

  case_id: "case_005_parent_child_control"
  relationship_type: "亲子（孩子17岁，高二）"
  person_a:
    mbti: "ESTJ"
    attachment_style: "权威-控制型（高焦虑但表现为高压）"
    core_traits: ["极度看重秩序与规则", "用提供物质代替情感共鸣", "慕强且慕优", "将不同意见视为对自身权威的挑衅"]
    trigger_points: "孩子表现出偏离自己规划的‘懒散’行为、挑战规则、或者对自己付出的‘牺牲感’表现出冷漠或不耐烦时。"
    typical_behavior: "遇到冲突时会进入‘审判长模式’，用恩赐的语气数落孩子的不是，喜欢翻旧账，并且用‘我这都是为你好’和‘你看看别人家孩子’作为终极压制手段。"

  person_b:
    mbti: "INFP"
    attachment_style: "恐惧-回避型（内心渴望依恋但害怕被吞噬）"
    core_traits: ["高敏感", "需要精神层面的被看见", "极度害怕被否定", "习惯性向内归因与自我防御"]
    trigger_points: "父母用居高临下的语气评判自己的内心世界、剥夺自己的自主决定权、或者在自己试图表达痛苦时被粗暴打断并定义为‘矫情’。"
    typical_behavior: "面对高压时会首先进入‘僵死模式’，眼神躲闪、沉默不语。如果被持续逼问，会突然像刺猬一样爆发，说出极度伤人的狠话（如‘我从来没要求你生下我’），随后立刻逃回房间锁门，陷入深度的自我厌恶与抑郁情绪。"

  current_crisis:
    event: "昨晚A在B书桌上发现了B写了一半的、带有轻微抑郁情绪的日记（其中有一句‘我觉得自己像个没有灵魂的容器’）。A没有安慰，反而把B叫到客厅，严厉指责B‘不知道感恩、每天吃好穿好瞎想什么’，并命令B当着面把那几页纸撕掉。B在颤抖中撕碎了纸，一言不发地走回房间反锁了门。"
    current_state: "今天早上A像没事人一样照常做好了丰盛的早餐，并在门外用不容置疑的语气喊B起床吃饭。B在房间里没有任何回应，A开始在外面大力敲门，语气从命令逐渐转为愤怒的威胁（‘你再不开门我就把锁卸了’）。"

  evaluator_focus: |
    重点推演：A的“强制粉饰太平与物理破门”策略会引发B怎样的应激反应？B现在的“绝对沉默”是求救信号还是彻底心死的预兆？在当前高压下，哪一方会先出现心理层面的“溃败”？如果想要避免不可逆的情感断裂（如孩子彻底封闭或极端行为），A必须立刻停止做什么，改做什么？

  ## Required Output Structure (Multi-Outcome Competition)

  The prediction MUST include these sections:
  1. 最可能结局（概率 X%） - Primary outcome with timeline and reasoning chain
  2. 替代结局 A（概率 Y%） - First alternative with trigger conditions and exclusion reasoning
  3. 替代结局 B（概率 Z%） - Second alternative with trigger conditions and exclusion reasoning
  4. 排除推理 - Summary of why primary > alternatives, citing specific trait differences

  Rules:
  - X + Y + Z = 100%, X > Y > Z, X > 50%
  - Each alternative must be a REAL possibility, not a strawman
  - Exclusion reasoning must cite SPECIFIC traits that determine the ranking


# Random seed for reproducibility across all components
random_seed: 42

# Base working directory where the task directory will be created
base_dir: "./runs"


# ==============================================================================
# SECTION 1.5: Workspace Configuration (工作空间配置)
# ==============================================================================
workspace:
  auto_create: true
  subdirs:
    output: "output"
    logs: "logs"
    checkpoints: "checkpoints"
    generated: "generated"
    cache: "cache"
    temp: "temp"


# ==============================================================================
# SECTION 2: LLM Provider Configuration (LLM 提供者配置)
# ==============================================================================
providers:
  - name: "default"
    type: "openai_compatible"
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    temperature: 0.9
    max_tokens: 3000
    timeout: 300.0


# ==============================================================================
# SECTION 3: Coder Configuration (代码生成器配置)
# ==============================================================================
coder:
  # --- Coder Type ---
  type: "custom"
  provider: "default"

  # --- Generation Parameters ---
  timeout: 300.0
  max_retries: 2


# ==============================================================================
# SECTION 4: Planner Configuration (规划器配置)
# ==============================================================================
planner:
  type: "llm_evolution"
  provider: "default"

  # Selection strategies
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"

  # Build configuration
  build:
    script: {}

  # Samplers
  samplers:
    - name: "init_sampler"


# ==============================================================================
# SECTION 5: Evaluator Configuration (评估器配置)
# ==============================================================================
evaluator:
  # --- Evaluator Type ---
  type: "custom"

  # Custom evaluator module path
  module: "relationship_evaluator.py:RelationshipOutcomeEvaluator"

  # --- Execution Settings ---
  timeout: 300.0
  max_retries: 2
  parallel: true
  batch_size: 2

  # --- Dataset Configuration ---
  dataset:
    mode: "directory"
    path: "data"
    recursive: false

  # --- Metrics ---
  metrics:
    - "outcome_plausibility"
    - "alternative_reasoning"
    - "trait_specificity"
    - "causal_chain"
    - "behavioral_concreteness"


# ==============================================================================
# SECTION 6: Evolution Configuration (进化算法配置)
# ==============================================================================
evolution:
  # --- Evolution Type ---
  type: "island_ga"

  # --- Common Parameters ---
  max_generations: 2
  early_stop_patience: 20
  early_stop_threshold: 0.000001
  checkpoint_interval: 5
  max_checkpoints: 3

  # --- Island GA Parameters ---
  elite_ratio: 0.25
  mutation_rate: 0.5
  crossover_rate: 0.4
  parent_selection_strategy: "tournament"
  survival_selection_strategy: "truncation"
  tournament_size: 2

  # Island-specific
  num_islands: 2
  island_population_size: 4
  migration_interval: 5
  migration_rate: 0.1
  migration_strategy: "random"
  migration_topology: "full"
  parallel_islands: true

  # --- Display ---
  human_readable_timing: true


# ==============================================================================
# SECTION 7: Multimodal Configuration (多模态配置)
# ==============================================================================
multimodal:
  enabled: false
  max_images_per_prompt: 3
  image_max_size_kb: 512
  include_observation_text: true
  two_step_refinement: false
  behavior_storage: "rendered"


# ==============================================================================
# SECTION 8: Logging Configuration (日志配置)
# ==============================================================================
logging:
  level: "INFO"
  format: null
  file: null
  console: true
  json_format: false


# ==============================================================================
# SECTION 9: Version Control Configuration (版本控制配置)
# ==============================================================================
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "workspace"
  remote_url: null
  revision: null
  auto_initialize: true
  auto_cleanup: true
  max_worktree_age_days: 7
  max_worktrees: 100
  default_branch: "main"
  commit_message_template: "Algorithm {algorithm_id}: {description}"


# ==============================================================================
# SECTION 10: Repository Analyzer Configuration (仓库分析器配置)
# ==============================================================================
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include:
    - "*.py"
  exclude:
    - ".git/**"
    - "__pycache__/**"
    - "*.pyc"
