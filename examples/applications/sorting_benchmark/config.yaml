# ==============================================================================
# LLM4AD Configuration for Sorting Benchmark (C++)
# ==============================================================================

# ==============================================================================
# SECTION 1: General Settings (通用设置)
# ==============================================================================
# Project name, used for output directory organization
project_name: "sorting_benchmark"

# Short descriptions for frontend display (English / Chinese)
description_en: "Evolve C++ sorting algorithms minimizing execution time across datasets of varied size and structure."
description_zh: "进化 C++ 排序算法，在不同规模与分布的数据集上最小化执行时间。"

# Background description of the task, passed to LLM for context
background: |
  In this benchmark, we aim to evolve efficient sorting algorithms in C++. The goal is to minimize
  execution time while correctly sorting a list of integers. The evolved algorithms will be evaluated
  on multiple datasets of varying sizes and characteristics, measuring execution time, number of
  comparisons, and number of swaps.

# Random seed for reproducibility across all components
random_seed: 42

# Base working directory where the task directory will be created
base_dir: "./runs"

# ==============================================================================
# SECTION 1.5: Workspace Configuration (工作空间配置)
# ==============================================================================
workspace:
  auto_create: true
  subdirs:
    output: "output"
    logs: "logs"
    checkpoints: "checkpoints"
    generated: "generated"
    cache: "cache"
    temp: "temp"

# ==============================================================================
# SECTION 2: LLM Provider Configuration (LLM 提供者配置)
# ==============================================================================
providers:
  - name: "default"
    type: "openai_compatible"
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    temperature: 0.7
    max_tokens: 4096
    timeout: 120.0

# ==============================================================================
# SECTION 3: Coder Configuration (代码生成器配置)
# ==============================================================================
coder:
  # --- Coder Type ---
  type: "custom"
  provider: "default"

  # --- Generation Parameters ---
  timeout: 300.0
  max_retries: 3
  temperature: 0.7
  max_gen_tokens: 4096
  context_max_tokens: 4096
  default_extension: "cpp"
  log_to_console: false

  # --- Prompt Template ---
  prompt_template: |
    You are tasked with implementing a sorting algorithm in C++.

    Problem Description:
    Implement the function signature below to sort a vector of integers in-place:
    ```cpp
    #include <vector>
    #include "sort_interface.h"

    SortResult sort(std::vector<int>& data) {
        // Your implementation here
    }
    ```

    The function must:
    1. Sort the integers in ascending order in-place
    2. Count the number of element comparisons
    3. Count the number of element swaps
    4. Return a SortResult struct with these counts

    Your goal is to minimize the execution time.

    Provide only the complete implementation of the sort function. Do not include the header guard or main function.

# ==============================================================================
# SECTION 4: Planner Configuration (规划器配置)
# ==============================================================================
planner:
  type: "llm_evolution"
  provider: "default"

  # Selection strategies
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"

  # Build configuration (C++ compilation)
  build:
    timeout: 120.0
    script:
      linux: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)
      darwin: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(sysctl -n hw.ncpu)
      windows: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

  # Samplers
  samplers:
    - name: "init_sampler"
    - name: "mutation_sampler"
    - name: "crossover_sampler"

# ==============================================================================
# SECTION 5: Evaluator Configuration (评估器配置)
# ==============================================================================
evaluator:
  # --- Evaluator Type ---
  type: "executable"

  # --- Executable Evaluator Fields ---
  executable: "build/sorting_benchmark"
  command: "{executable} {data_file}"

  # --- Execution Settings ---
  timeout: 60.0
  max_retries: 3
  parallel: true
  batch_size: 5

  # --- Metric Patterns ---
  metric_patterns:
    - name: "execution_time_ms"
      pattern: "execution_time_ms:\\s*([\\d.]+)"
      type: "minimize"
      weight: 1.0
    - name: "comparisons"
      pattern: "comparisons:\\s*([\\d.]+)"
      type: "minimize"
      weight: 0.0
    - name: "swaps"
      pattern: "swaps:\\s*([\\d.]+)"
      type: "minimize"
      weight: 0.0
    - name: "correct"
      pattern: "correct:\\s*([\\d.]+)"
      type: "maximize"
      weight: 0.0

  # --- Dataset Configuration ---
  dataset:
    mode: "directory"
    path: "data/small"
    recursive: false

# ==============================================================================
# SECTION 6: Evolution Configuration (进化算法配置)
# ==============================================================================
evolution:
  # --- Evolution Type ---
  type: "island_ga"

  # --- Common Parameters ---
  max_generations: 2
  early_stop_patience: 10
  early_stop_threshold: 0.000001
  checkpoint_interval: 5
  max_checkpoints: 3

  # --- Island GA Parameters ---
  elite_ratio: 0.1
  mutation_rate: 0.3
  crossover_rate: 0.5
  parent_selection_strategy: "tournament"
  survival_selection_strategy: "truncation"
  tournament_size: 3

  # Island-specific
  num_islands: 1
  island_population_size: 2
  migration_interval: 5
  migration_rate: 0.1
  migration_strategy: "random"
  migration_topology: "full"
  parallel_islands: true

  # --- Display ---
  human_readable_timing: true

# ==============================================================================
# SECTION 7: Multimodal Configuration (多模态配置)
# ==============================================================================
multimodal:
  enabled: false
  max_images_per_prompt: 3
  image_max_size_kb: 512
  include_observation_text: true
  two_step_refinement: false
  behavior_storage: "rendered"

# ==============================================================================
# SECTION 8: Logging Configuration (日志配置)
# ==============================================================================
logging:
  level: "INFO"
  format: null
  file: null
  console: true
  json_format: false

# ==============================================================================
# SECTION 9: Version Control Configuration (版本控制配置)
# ==============================================================================
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "sorting_algorithm"
  remote_url: null
  revision: null
  auto_initialize: true
  auto_cleanup: true
  max_worktree_age_days: 7
  max_worktrees: 100
  default_branch: "main"
  commit_message_template: "Algorithm {algorithm_id}: {description}"

# ==============================================================================
# SECTION 10: Repository Analyzer Configuration (仓库分析器配置)
# ==============================================================================
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include:
    - "*.cpp"
    - "*.h"
    - "*.py"
  exclude:
    - ".git/**"
    - "__pycache__/**"
    - "build/**"
    - "*.pyc"
