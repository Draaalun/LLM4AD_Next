# ==============================================================================
# LLM4AD Task Configuration Template (Python Multimodal)
# ==============================================================================

# ==============================================================================
# SECTION 1: General Settings (通用设置)
# ==============================================================================
# Project name, used for output directory organization
project_name: "my_task_python_multimodal"

# Short descriptions for frontend display (English / Chinese)
description_en: "Multimodal template that evolves 2D function minimizers using contour plot images of the search trajectory."
description_zh: "多模态任务模板：结合搜索轨迹的等高线图像，进化二维函数极小化算法。"

# Background description of the task, passed to LLM for context
background: |
  In this benchmark, we aim to evolve efficient optimization algorithms
  for 2D function minimization. The goal is to find the global minimum
  of a function f(x, y) on a bounded domain, given a pre-computed grid
  of function values. The algorithms are evaluated on how close they get
  to the known optimum and how many function evaluations they use.

  The multimodal version includes contour plot visualizations with search
  trajectories in LLM prompts, allowing the model to visually diagnose
  search patterns and propose targeted improvements.

# Random seed for reproducibility across all components
random_seed: 42

# Base working directory where the task directory will be created
base_dir: "./runs"

# ==============================================================================
# SECTION 1.5: Workspace Configuration (工作空间配置)
# ==============================================================================
workspace:
  auto_create: true
  subdirs:
    output: "output"
    logs: "logs"
    checkpoints: "checkpoints"
    generated: "generated"
    cache: "cache"
    temp: "temp"

# ==============================================================================
# SECTION 2: LLM Provider Configuration (LLM 提供者配置)
# ==============================================================================
providers:
  - name: "default"
    type: "openai_compatible"
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    temperature: 0.7
    max_tokens: 4096
    timeout: 120.0

# ==============================================================================
# SECTION 3: Coder Configuration (代码生成器配置)
# ==============================================================================
coder:
  # --- Coder Type ---
  type: "custom"
  provider: "default"

  # --- Generation Parameters ---
  timeout: 300.0
  max_retries: 3
  temperature: 0.7
  max_gen_tokens: 4096
  context_max_tokens: 4096
  default_extension: "py"
  log_to_console: false

  # --- Prompt Template ---
  prompt_template: |
    You are tasked with implementing an optimization algorithm for 2D function minimization.

    Problem Description:
    Given a 2D function f(x, y) defined on a bounded grid, find the point (x, y)
    that minimizes f. You have access to the function values on a grid.

    Your task is to implement the function signature below:

    ```python
    import numpy as np

    # EVOLVE_START
    def my_algorithm(grid_values, x_range, y_range):
        '''Find the minimum of a 2D function given its grid values.

        Args:
            grid_values: 2D numpy array of function values
            x_range: tuple (x_min, x_max) defining the x domain
            y_range: tuple (y_min, y_max) defining the y domain

        Returns:
            dict with keys:
                "x": x-coordinate of estimated minimum
                "y": y-coordinate of estimated minimum
                "trajectory": list of (x, y) points visited during search
        '''
        pass
    # EVOLVE_END
    ```

    Requirements:
    1. Find the global minimum as accurately as possible
    2. Use as few function evaluations as possible
    3. Return the search trajectory for visualization

    Consider approaches like:
    - Grid search with refinement
    - Random search with restarts
    - Simulated annealing
    - Basin-hopping
    - Evolutionary strategies

    Provide only the complete implementation of the my_algorithm function
    between EVOLVE_START and EVOLVE_END markers.

# ==============================================================================
# SECTION 4: Planner Configuration (规划器配置)
# ==============================================================================
planner:
  type: "llm_evolution"
  provider: "default"

  # Selection strategies
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"

  # Build configuration
  build:
    script: {}

  # Samplers (multimodal operators for visual grounding)
  samplers:
    - name: "init_sampler"
    - name: "multimodal_mutation_sampler"
    - name: "multimodal_crossover_sampler"

# ==============================================================================
# SECTION 5: Evaluator Configuration (评估器配置)
# ==============================================================================
evaluator:
  # --- Evaluator Type ---
  type: "custom"

  # Custom evaluator module path
  module: "my_evaluator.py:MyTaskEvaluatorMultimodal"

  # --- Execution Settings ---
  timeout: 60.0
  max_retries: 2
  parallel: true
  batch_size: 5

  # --- Dataset Configuration ---
  dataset:
    mode: "directory"
    path: "data/sample"
    recursive: false

  # --- Metrics ---
  metrics:
    - "primary_score"
    - "execution_time_ms"

# ==============================================================================
# SECTION 6: Evolution Configuration (进化算法配置)
# ==============================================================================
evolution:
  # --- Evolution Type ---
  type: "island_ga"

  # --- Common Parameters ---
  max_generations: 5
  early_stop_patience: 10
  early_stop_threshold: 0.000001
  checkpoint_interval: 5
  max_checkpoints: 3

  # --- Island GA Parameters ---
  elite_ratio: 0.1
  mutation_rate: 0.3
  crossover_rate: 0.5
  parent_selection_strategy: "tournament"
  survival_selection_strategy: "truncation"
  tournament_size: 3

  # Island-specific
  num_islands: 2
  island_population_size: 3
  migration_interval: 5
  migration_rate: 0.1
  migration_strategy: "random"
  migration_topology: "full"
  parallel_islands: true

  # --- Display ---
  human_readable_timing: true

# ==============================================================================
# SECTION 7: Multimodal Configuration (多模态配置)
# ==============================================================================
multimodal:
  enabled: true
  max_images_per_prompt: 3
  image_max_size_kb: 512
  include_observation_text: true
  two_step_refinement: false
  behavior_storage: "rendered"

# ==============================================================================
# SECTION 8: Logging Configuration (日志配置)
# ==============================================================================
logging:
  level: "INFO"
  format: null
  file: null
  console: true
  json_format: false

# ==============================================================================
# SECTION 9: Version Control Configuration (版本控制配置)
# ==============================================================================
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "my_algorithm"
  remote_url: null
  revision: null
  auto_initialize: true
  auto_cleanup: true
  max_worktree_age_days: 7
  max_worktrees: 100
  default_branch: "main"
  commit_message_template: "Algorithm {algorithm_id}: {description}"

# ==============================================================================
# SECTION 10: Repository Analyzer Configuration (仓库分析器配置)
# ==============================================================================
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include:
    - "*.py"
  exclude:
    - ".git/**"
    - "__pycache__/**"
    - "*.pyc"
