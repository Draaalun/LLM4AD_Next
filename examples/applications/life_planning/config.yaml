# ==============================================================================
# LLM4AD Configuration for Life Planning (Code-Based Prompt Evolution)
# ==============================================================================


# ==============================================================================
# SECTION 1: General Settings (通用设置)
# ==============================================================================
# Project name, used for output directory organization
project_name: "life_planning"

# Short descriptions for frontend display (English / Chinese)
description_en: "Evolve prompt engineering strategies for an LLM-based personalized life plan generator."
description_zh: "进化基于 LLM 的个性化人生规划生成器中的提示词工程策略。"

# Background description of the task, passed to LLM for context
background: |
  This project evolves the prompt engineering strategy for an LLM-based life plan generator.
  A Python script reads a user profile and calls an LLM API to generate a personalized
  Markdown life plan. The EVOLVE block contains the prompt construction logic.

# Random seed for reproducibility across all components
random_seed: 42

# Base working directory where the task directory will be created
base_dir: "./runs"


# ==============================================================================
# SECTION 1.5: Workspace Configuration (工作空间配置)
# ==============================================================================
workspace:
  auto_create: true
  subdirs:
    output: "output"
    logs: "logs"
    checkpoints: "checkpoints"
    generated: "generated"
    cache: "cache"
    temp: "temp"


# ==============================================================================
# SECTION 2: LLM Provider Configuration (LLM 提供者配置)
# ==============================================================================
providers:
  - name: "planner_llm"
    type: "openai_compatible"
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    temperature: 0.8
    max_tokens: 4096
    timeout: 300.0


# ==============================================================================
# SECTION 3: Coder Configuration (代码生成器配置)
# ==============================================================================
coder:
  # --- Coder Type ---
  type: "custom"
  provider: "default"

  # --- Generation Parameters ---
  timeout: 300.0
  max_retries: 2


# ==============================================================================
# SECTION 4: Planner Configuration (规划器配置)
# ==============================================================================
planner:
  type: "llm_evolution"
  provider: "default"

  # Selection strategies
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"

  # Samplers
  samplers:
    - name: "init_sampler"


# ==============================================================================
# SECTION 5: Evaluator Configuration (评估器配置)
# ==============================================================================
evaluator:
  # --- Evaluator Type ---
  type: "custom"

  # Custom evaluator module path
  module: "life_evaluator.py:LifePlanningEvaluator"

  # --- Execution Settings ---
  timeout: 300.0
  max_retries: 2
  parallel: true
  batch_size: 4

  # --- Evaluator-specific API config ---
  api_config:
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL}

  # --- Dataset Configuration ---
  dataset:
    mode: "directory"
    path: "data"
    recursive: false

  # --- Metrics ---
  metrics:
    - "actionability"
    - "alignment"
    - "comprehensiveness"


# ==============================================================================
# SECTION 6: Evolution Configuration (进化算法配置)
# ==============================================================================
evolution:
  # --- Evolution Type ---
  type: "island_ga"

  # --- Common Parameters ---
  max_generations: 3
  early_stop_patience: 20
  early_stop_threshold: 0.000001
  checkpoint_interval: 5
  max_checkpoints: 3

  # --- Island GA Parameters ---
  elite_ratio: 0.1
  mutation_rate: 0.4
  crossover_rate: 0.5
  parent_selection_strategy: "tournament"
  survival_selection_strategy: "truncation"
  tournament_size: 2

  # Island-specific
  num_islands: 2
  island_population_size: 2
  migration_interval: 5
  migration_rate: 0.1
  migration_strategy: "random"
  migration_topology: "full"
  parallel_islands: true

  # --- Display ---
  human_readable_timing: true


# ==============================================================================
# SECTION 7: Multimodal Configuration (多模态配置)
# ==============================================================================
multimodal:
  enabled: false
  max_images_per_prompt: 3
  image_max_size_kb: 512
  include_observation_text: true
  two_step_refinement: false
  behavior_storage: "rendered"


# ==============================================================================
# SECTION 8: Logging Configuration (日志配置)
# ==============================================================================
logging:
  level: "INFO"
  format: null
  file: null
  console: true
  json_format: false


# ==============================================================================
# SECTION 9: Version Control Configuration (版本控制配置)
# ==============================================================================
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "workspace"
  remote_url: null
  revision: null
  auto_initialize: true
  auto_cleanup: true
  max_worktree_age_days: 7
  max_worktrees: 100
  default_branch: "main"
  commit_message_template: "Algorithm {algorithm_id}: {description}"


# ==============================================================================
# SECTION 10: Repository Analyzer Configuration (仓库分析器配置)
# ==============================================================================
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include:
    - "*.py"
  exclude:
    - ".git/**"
    - "__pycache__/**"
    - "*.pyc"
