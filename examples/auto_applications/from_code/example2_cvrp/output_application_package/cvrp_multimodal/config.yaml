# ==========================================================================
# LLM4AD Task Configuration — Auto-generated by llm4ad build
# ==========================================================================

project_name: "cvrp_multimodal"

background: |
  The Capacitated Vehicle Routing Problem (CVRP) requires finding minimum-cost routes for a fleet of vehicles to serve all customers from a central depot, subject to vehicle capacity constraints. Each customer has a known demand and must be visited exactly once. The algorithm constructs solutions greedily by selecting the next node to visit at each step, and the goal is to minimize total route distance relative to known baselines.

base_dir: "./runs"
random_seed: 42

# ===== LLM Provider Configuration =====
providers:
  - name: "default"
    type: "openai_compatible"
    base_url: "${LLM4AD_BASE_URL}"
    api_key: "${LLM4AD_API_KEY}"
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 4096
    timeout: 120.0

# ===== Multimodal Configuration =====
multimodal:
  enabled: true
  max_images_per_prompt: 3
  image_max_size_kb: 512
  include_observation_text: true
  behavior_storage: "rendered"

# ===== Evaluator Configuration =====
evaluator:
  type: "custom"
  module: "cvrp_multimodal_evaluator.py:CVRPMultimodalEvaluator"
  timeout: 60.0
  max_retries: 2
  parallel: true
  batch_size: 5
  dataset:
    mode: "directory"
    path: "data/sample"
    recursive: false
  metrics: ["normalized_gap"]

# ===== Evolution Configuration =====
evolution:
  type: "island_ga"
  num_islands: 1
  island_population_size: 2
  max_generations: 5
  elite_ratio: 0.1
  mutation_rate: 0.3
  crossover_rate: 0.5
  selection_strategy: "tournament"
  tournament_size: 3
  early_stop_patience: 10
  early_stop_threshold: 1e-6
  checkpoint_interval: 5
  max_checkpoints: 3

# ===== Planner Configuration =====
planner:
  type: "llm_evolution"
  provider: "default"
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"
  samplers:
    - name: "init_sampler"
    - name: "multimodal_mutation_sampler"
    - name: "multimodal_crossover_sampler"

# ===== Coder Configuration =====
coder:
  type: "custom"
  provider: "default"
  prompt_template: |
    You are tasked with implementing an algorithm for: cvrp multimodal

    The Capacitated Vehicle Routing Problem (CVRP) requires finding minimum-cost routes for a fleet of vehicles to serve all customers from a central depot, subject to vehicle capacity constraints. Each customer has a known demand and must be visited exactly once. The algorithm constructs solutions greedily by selecting the next node to visit at each step, and the goal is to minimize total route distance relative to known baselines.

    Your task is to implement the function below. Only modify code between
    EVOLVE_START and EVOLVE_END markers.

    ```python
    ```python
    from __future__ import annotations
    import sys
    import json
    import copy
    import numpy as np
    from typing import List

    # EVOLVE_START
    def select_next_node(current_node: int, depot: int, unvisited_nodes: np.ndarray, rest_capacity: np.ndarray,
                             demands: np.ndarray, distance_matrix: np.ndarray) -> int:
            """Design a novel algorithm to select the next node in each step.
            Args:
                current_node: ID of the current node.
                depot: ID of the depot.
                unvisited_nodes: Array of IDs of unvisited nodes.
                rest_capacity: rest capacity of vehicle
                demands: demands of nodes
                distance_matrix: Distance matrix of nodes.
            Return:
                ID of the next node to visit.
            """
            feasible_nodes = [node for node in unvisited_nodes if demands[node] <= rest_capacity]
            if not feasible_nodes:
                return depot
            scores = [demands[node] / distance_matrix[current_node][node] for node in feasible_nodes]
            return feasible_nodes[np.argmax(scores)]
    # EVOLVE_END

    def tour_cost(coordinates: np.ndarray, solution: List[int]) -> float:
        """Compute total Euclidean distance of the route, returning to depot at the end."""
        cost = 0.0
        for j in range(len(solution) - 1):
            cost += np.linalg.norm(coordinates[int(solution[j])] - coordinates[int(solution[j + 1])])
        cost += np.linalg.norm(coordinates[int(solution[-1])] - coordinates[int(solution[0])])
        return cost

    def route_construct(distance_matrix: np.ndarray, demands: np.ndarray,
                        vehicle_capacity: int, problem_size: int) -> List[int]:
        """Build a complete route using the select_next_node heuristic."""
        route = []
        current_load = 0
        current_node = 0
        route.append(current_node)

        unvisited_nodes = set(range(1, problem_size))
        all_nodes = np.array(list(unvisited_nodes))
        feasible_unvisited_nodes = all_nodes.copy()

        while unvisited_nodes:
            next_node = select_next_node(
                current_node,
                0,
                feasible_unvisited_nodes,
                vehicle_capacity - current_load,
                copy.deepcopy(demands),
                copy.deepcopy(distance_matrix)
            )

            if next_node == 0:
                route.append(next_node)
                current_load = 0
                current_node = 0
            else:
                route.append(next_node)
                current_load += demands[next_node]
                unvisited_nodes.remove(next_node)
                current_node = next_node

            feasible_nodes_capacity = np.array(
                [node for node in all_nodes if current_load + demands[node] <= vehicle_capacity]
            )
            feasible_unvisited_nodes = np.intersect1d(feasible_nodes_capacity, list(unvisited_nodes))

            if len(unvisited_nodes) > 0 and len(feasible_unvisited_nodes) < 1:
                route.append(0)
                current_load = 0
                current_node = 0
                feasible_unvisited_nodes = np.array(list(unvisited_nodes))

        # Ensure route ends at depot
        if route[-1] != 0:
            route.append(0)

        # Validate all nodes visited
        independent_values = set(route)
        if len(independent_values) != problem_size:
            return None

        return route

    def solve(input_data: dict) -> dict:
        """Solve a CVRP instance using the greedy route-construction heuristic.

        Args:
            input_data: dict with keys coordinates, distances, demands, capacity, and optionally label.

        Returns:
            dict with keys 'routes' (list of ints) and 'total_cost' (float).
        """
        coordinates = np.array(input_data["coordinates"], dtype=float)
        distance_matrix = np.array(input_data["distances"], dtype=float)
        demands = np.array(input_data["demands"], dtype=float)
        vehicle_capacity = int(input_data["capacity"])
        problem_size = len(demands)

        route = route_construct(distance_matrix, demands, vehicle_capacity, problem_size)

        if route is None:
            return {"routes": [], "total_cost": float("inf")}

        total_cost = tour_cost(coordinates, route)

        return {
            "routes": route,
            "total_cost": float(total_cost)
        }

    def main():
        if len(sys.argv) < 2:
            print("Usage: python driver.py <input.json>", file=sys.stderr)
            sys.exit(1)

        with open(sys.argv[1], "r") as f:
            input_data = json.load(f)

        result = solve(input_data)
        print(json.dumps(result))

    if __name__ == "__main__":
        main()
    ```
    ```

    Requirements:
    1. Implement the `select_next_node` function between EVOLVE_START and EVOLVE_END
    2. Input format: The function receives six arguments at each construction step: current_node (int), depot (int, always 0), unvisited_nodes (np.ndarray of feasible unvisited node IDs), rest_capacity (numeric remaining capacity), demands (np.ndarray of all node demands), and distance_matrix (2D np.ndarray of pairwise distances). The evaluation framework calls this function repeatedly to build a complete route.
    3. Output format: The function returns a single integer: the ID of the next node to visit. Returning the depot ID (0) signals the vehicle should return to the depot and start a new route. The evaluation framework assembles the full route from successive calls and computes the total tour cost.
    4. Optimization goals: - normalized_gap: Negative normalized gap to baseline: -(LLM_distance - baseline) / baseline. Higher (closer to 0) is better. A value of 0 means matching the baseline; positive values mean beating it. (higher is better)

    Provide only the complete implementation of the select_next_node function
    between EVOLVE_START and EVOLVE_END markers.

# ===== Memory Configuration =====
memory:
  embedding_dim: 768
  max_entries: 1000
  similarity_threshold: 0.8
  decay_factor: 0.99

# ===== Logging Configuration =====
logging:
  level: "INFO"
  console: true
  json_format: false

# ===== Version Control Configuration =====
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "./algorithm"
  auto_initialize: true
  auto_cleanup: true

# ===== Repository Analyzer Configuration =====
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include: ["*.py"]
  exclude: [".git/**", "__pycache__/**", "*.pyc"]
