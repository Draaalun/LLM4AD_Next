# ==========================================================================
# LLM4AD Task Configuration — Auto-generated by llm4ad build
# ==========================================================================

project_name: "bipedal_walker"

background: |
  The BipedalWalker-v3 environment from Gymnasium requires a controller to keep a bipedal robot walking and moving forward. The goal is to design a heuristic control algorithm that can achieve a total reward exceeding 300 within a maximum of 1600 simulation steps. The controller receives continuous observations (24 values) and must output continuous actions (4 torques).

base_dir: "./runs"
random_seed: 42

# ===== LLM Provider Configuration =====
providers:
  - name: "default"
    type: "openai_compatible"
    base_url: "${LLM4AD_BASE_URL}"
    api_key: "${LLM4AD_API_KEY}"
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 4096
    timeout: 120.0

# ===== Evaluator Configuration =====
evaluator:
  type: "custom"
  module: "bipedal_walker_evaluator.py:BipedalWalkerEvaluator"
  timeout: 60.0
  max_retries: 2
  parallel: true
  batch_size: 5
  dataset:
    mode: "directory"
    path: "data/sample"
    recursive: false
  metrics: ["mean_score"]

# ===== Evolution Configuration =====
evolution:
  type: "island_ga"
  num_islands: 1
  island_population_size: 2
  max_generations: 5
  elite_ratio: 0.1
  mutation_rate: 0.3
  crossover_rate: 0.5
  selection_strategy: "tournament"
  tournament_size: 3
  early_stop_patience: 10
  early_stop_threshold: 1e-6
  checkpoint_interval: 5
  max_checkpoints: 3

# ===== Planner Configuration =====
planner:
  type: "llm_evolution"
  provider: "default"
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"
  samplers:
    - name: "init_sampler"
    - name: "mutation_sampler"
    - name: "crossover_sampler"

# ===== Coder Configuration =====
coder:
  type: "custom"
  provider: "default"
  prompt_template: |
    You are tasked with implementing an algorithm for: bipedal walker

    The BipedalWalker-v3 environment from Gymnasium requires a controller to keep a bipedal robot walking and moving forward. The goal is to design a heuristic control algorithm that can achieve a total reward exceeding 300 within a maximum of 1600 simulation steps. The controller receives continuous observations (24 values) and must output continuous actions (4 torques).

    Your task is to implement the function below. Only modify code between
    EVOLVE_START and EVOLVE_END markers.

    ```python
    import json
    import sys

    # EVOLVE_START
    def walker_controller(observation: list) -> list:
        """Implements a heuristic control policy for the BipedalWalker-v3 environment. Takes a list of 24 floating-point observations (lidar distances, angles, velocities, etc.) and returns a list of 4 floating-point action values (hip/knee torques) each clipped to [-1, 1]."""
        pass
    # EVOLVE_END

    def process(data):
        result = walker_controller(data)
        return {"result": result}

    def main():
        if len(sys.argv) < 2:
            sys.exit(1)
        input_data = json.loads(sys.argv[1])
        result = process(input_data)
        print(json.dumps(result))

    if __name__ == "__main__":
        main()
    ```

    Requirements:
    1. Implement the `walker_controller` function between EVOLVE_START and EVOLVE_END
    2. Input format: A list of 24 floats representing the current observation from the BipedalWalker-v3 environment: hull angle, hull angular velocity, velocity x, velocity y, hip joint 1 angle, hip joint 1 speed, knee joint 1 angle, knee joint 1 speed, leg 1 ground contact flag, hip joint 2 angle, hip joint 2 speed, knee joint 2 angle, knee joint 2 speed, leg 2 ground contact flag, and 10 lidar range finder measurements.
    3. Output format: A list of 4 floats, each in the range [-1, 1], corresponding to: torque for hip 1, torque for knee 1, torque for hip 2, torque for knee 2.
    4. Optimization goals: - mean_score: Average total reward accumulated over a fixed number of evaluation episodes (each truncated at 1600 steps). Higher scores indicate better walking performance. (higher is better)

    Provide only the complete implementation of the walker_controller function
    between EVOLVE_START and EVOLVE_END markers.

# ===== Memory Configuration =====
memory:
  embedding_dim: 768
  max_entries: 1000
  similarity_threshold: 0.8
  decay_factor: 0.99

# ===== Logging Configuration =====
logging:
  level: "INFO"
  console: true
  json_format: false

# ===== Version Control Configuration =====
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "./bipedal_walker_algorithm"
  auto_initialize: true
  auto_cleanup: true

# ===== Repository Analyzer Configuration =====
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include: ["*.py"]
  exclude: [".git/**", "__pycache__/**", "*.pyc"]
