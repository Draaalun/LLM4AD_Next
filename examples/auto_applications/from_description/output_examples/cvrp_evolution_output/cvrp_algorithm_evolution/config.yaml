# ==========================================================================
# LLM4AD Task Configuration — Auto-generated by llm4ad build
# ==========================================================================

project_name: "cvrp_algorithm_evolution"

background: |
  The Capacitated Vehicle Routing Problem (CVRP) requires finding minimum-distance routes for a fleet of capacity-limited vehicles serving customers from a single depot. Each customer has a known demand and must be visited exactly once, and every route must start and end at the depot (index 0). The total demand on any route cannot exceed the vehicle capacity Q. The goal is to evolve heuristic or metaheuristic construction strategies that minimize total Euclidean travel distance while respecting capacity constraints.

base_dir: "./runs"
random_seed: 42

# ===== LLM Provider Configuration =====
providers:
  - name: "default"
    type: "openai_compatible"
    base_url: "${LLM4AD_BASE_URL}"
    api_key: "${LLM4AD_API_KEY}"
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 4096
    timeout: 120.0

# ===== Multimodal Configuration =====
multimodal:
  enabled: true
  max_images_per_prompt: 3
  image_max_size_kb: 512
  include_observation_text: true
  behavior_storage: "rendered"

# ===== Evaluator Configuration =====
evaluator:
  type: "custom"
  module: "cvrp_algorithm_evolution_evaluator.py:CVRPAlgorithmEvolutionEvaluatorMultimodal"
  timeout: 60.0
  max_retries: 2
  parallel: true
  batch_size: 5
  dataset:
    mode: "directory"
    path: "data/sample"
    recursive: false
  metrics: ["total_distance", "num_routes", "feasibility_penalty"]

# ===== Evolution Configuration =====
evolution:
  type: "island_ga"
  num_islands: 1
  island_population_size: 2
  max_generations: 5
  elite_ratio: 0.1
  mutation_rate: 0.3
  crossover_rate: 0.5
  selection_strategy: "tournament"
  tournament_size: 3
  early_stop_patience: 10
  early_stop_threshold: 1e-6
  checkpoint_interval: 5
  max_checkpoints: 3

# ===== Planner Configuration =====
planner:
  type: "llm_evolution"
  provider: "default"
  selection_strategy: "weighted"
  parent_selection_strategy: "tournament"
  samplers:
    - name: "init_sampler"
    - name: "multimodal_mutation_sampler"
    - name: "multimodal_crossover_sampler"

# ===== Coder Configuration =====
coder:
  type: "custom"
  provider: "default"
  prompt_template: |
    You are tasked with implementing an algorithm for: cvrp algorithm evolution

    The Capacitated Vehicle Routing Problem (CVRP) requires finding minimum-distance routes for a fleet of capacity-limited vehicles serving customers from a single depot. Each customer has a known demand and must be visited exactly once, and every route must start and end at the depot (index 0). The total demand on any route cannot exceed the vehicle capacity Q. The goal is to evolve heuristic or metaheuristic construction strategies that minimize total Euclidean travel distance while respecting capacity constraints.

    Your task is to implement the function below. Only modify code between
    EVOLVE_START and EVOLVE_END markers.

    ```python
    import json
    import sys

    # EVOLVE_START
    def solve_cvrp(nodes: list[tuple[float, float]], demands: list[int], capacity: int) -> dict:
        """Constructs a set of vehicle routes for the CVRP. Takes a list of (x, y) node coordinates (index 0 is the depot), a list of integer demands per node (demand at index 0 is 0), and the integer vehicle capacity Q. Returns a dictionary with keys: 'routes' (list of lists, each sub-list is an ordered sequence of node indices starting and ending with 0), 'total_distance' (float, sum of Euclidean distances across all routes), and 'metadata' (dict with optional diagnostic counters such as 'num_routes', 'iterations', 'swaps')."""
        pass
    # EVOLVE_END

    def process(data):
        result = solve_cvrp(data)
        return {"result": result}

    def main():
        if len(sys.argv) < 2:
            sys.exit(1)
        input_data = json.loads(sys.argv[1])
        result = process(input_data)
        print(json.dumps(result))

    if __name__ == "__main__":
        main()
    ```

    Requirements:
    1. Implement the `solve_cvrp` function between EVOLVE_START and EVOLVE_END
    2. Input format: nodes: list of (x, y) float tuples where index 0 is the depot. demands: list of integers where index 0 is 0. capacity: integer Q representing the maximum load per vehicle.
    3. Output format: A dictionary with keys 'routes' (list of lists of int, each sub-list starts and ends with 0), 'total_distance' (float), and 'metadata' (dict with diagnostic info such as 'num_routes', 'iterations', 'swaps').
    4. Optimization goals: - total_distance: Total Euclidean distance traveled across all vehicle routes. This is the primary optimization objective. (lower is better)
    - num_routes: Number of vehicles (routes) used. Fewer routes generally indicate better packing of customer demands into vehicles. (lower is better)
    - feasibility_penalty: Penalty score for constraint violations: unvisited customers, duplicate visits, or routes exceeding vehicle capacity. A feasible solution scores 0. (lower is better)

    Provide only the complete implementation of the solve_cvrp function
    between EVOLVE_START and EVOLVE_END markers.

# ===== Memory Configuration =====
memory:
  embedding_dim: 768
  max_entries: 1000
  similarity_threshold: 0.8
  decay_factor: 0.99

# ===== Logging Configuration =====
logging:
  level: "INFO"
  console: true
  json_format: false

# ===== Version Control Configuration =====
version_control:
  enabled: true
  type: "git_worktree"
  local_path: "./cvrp_solver_algorithm"
  auto_initialize: true
  auto_cleanup: true

# ===== Repository Analyzer Configuration =====
repo_analyzer:
  type: "evolve_detector"
  context_lines_before: 5
  context_lines_after: 5
  include: ["*.py"]
  exclude: [".git/**", "__pycache__/**", "*.pyc"]
